name: Database Integration

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mysql:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["8.4.11", "9.6.0"]
    services:
      mysql:
        image: mysql:${{ matrix.version }}
        env:
          MYSQL_ROOT_PASSWORD: root-test-password
          MYSQL_DATABASE: easybot_test
          MYSQL_USER: easybot
          MYSQL_PASSWORD: easybot-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-test-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: dev/go.mod
          cache-dependency-path: dev/go.sum
      - name: Test against MySQL
        working-directory: dev
        env:
          EASYBOT_TEST_DATABASE_DSN: mysql://easybot:easybot-test-password@127.0.0.1:3306/easybot_test
        run: go test ./...

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: easybot_test
          POSTGRES_USER: easybot
          POSTGRES_PASSWORD: easybot-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U easybot -d easybot_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: dev/go.mod
          cache-dependency-path: dev/go.sum
      - name: Test against PostgreSQL
        working-directory: dev
        env:
          EASYBOT_TEST_DATABASE_DSN: postgres://easybot:easybot-test-password@127.0.0.1:5432/easybot_test?sslmode=disable
        run: go test ./...
